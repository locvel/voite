coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tool/**/*"
  - "benchmark/**/*"
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/l10n/*.dart"
