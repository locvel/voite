name: Bug report
description: Report a reproducible problem in Voite
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Voite. Do not attach personal recordings,
        transcripts, diary entries, or encryption keys. Use synthetic data or
        the benchmark fixture instead.

        For security vulnerabilities, use the private process in SECURITY.md
        instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
      placeholder: When I stop a recording after switching apps...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Record tab
        2. Start a recording
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Voite version and build
      placeholder: 1.0.0 (1)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: iPhone 16 Pro Max, iOS 27.2 / Pixel 9, Android 16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data before uploading.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real recordings, transcripts, diary entries, or secrets.
          required: true
