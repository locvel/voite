name: Greetings

on: [pull_request_target, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hi there! Thanks for opening your first issue in Voite!
            
            We appreciate you taking the time to contribute. A maintainer will review this soon.
            
            In the meantime:
            - Make sure you've provided all the necessary details
            - Check if there's a similar issue already open
            - Feel free to join discussions in other issues
            
            Happy coding! 🎉
          pr-message: |
            🎉 Awesome! Thanks for opening your first pull request in Voite!
            
            A maintainer will review your changes soon. Here are a few reminders:
            - Make sure all tests pass
            - Follow the code style guidelines
            - Update documentation if needed
            - Link any related issues
            
            We appreciate your contribution! 🚀
