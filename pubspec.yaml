name: voicerecorder
description: Private, offline voice recorder and diary with on-device transcription.
publish_to: none
homepage: https://github.com/locvel/voite
repository: https://github.com/locvel/voite
issue_tracker: https://github.com/locvel/voite/issues
version: 1.0.0+2282

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: 2.0.1
  record: 7.1.2
  just_audio: 0.10.6
  drift: 2.35.4
  # SQLCipher's Drift executor is an upstream Git package. This replaces
  # drift_flutter because Drift's encryption guide directs SQLCipher users to it.
  encrypted_drift:
    git:
      url: https://github.com/simolus3/drift.git
      path: extras/encryption
      ref: a745ade989e89f88d91663a0a34695fa943a50b0
  flutter_riverpod: 3.5.0
  riverpod_annotation: 4.0.8
  go_router: 18.1.3
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  sqflite_sqlcipher: 3.4.1
  flutter_foreground_task: 11.0.3
  flutter_local_notifications: 21.0.0
  audio_session: 0.2.4
  path_provider: 2.1.6
  path: 1.9.1
  crypto: 3.0.8
  connectivity_plus: 7.3.1
  uuid: 4.6.0
  video_player: ^2.10.0
  pdf: ^3.12.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1
  riverpod_generator: 4.0.10

# pdf 3.12 currently caps archive below 4.1, while image 4.11 calls
# archive's later decodeLazy API. Keep the transitive image version on the
# last compatible line until those upstream constraints agree.
dependency_overrides:
  image: 4.10.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/logo/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
